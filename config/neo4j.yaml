# Neo4j Connection
# Inside Docker the 'NEO4J_URI' env var overrides this (set to bolt://neo4j:7687)
uri: "bolt://neo4j:7687"
user: "neo4j"
password: "chainbreaker"
database: "neo4j"
max_connection_lifetime: 3600
max_connection_pool_size: 50
connection_acquisition_timeout: 60

# Schema
auto_create_constraints: true
auto_create_indexes: true

# Query timeouts
default_query_timeout: 30

# Flow ingestion
flow_batch_size: 100
flow_ingest_timeout: 30
